[package]
name = "project-visibility-dashboard"
version = "0.1.0"
description = "Project Visibility Dashboard desktop app"
edition = "2021"

[lib]
name = "project_visibility_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
